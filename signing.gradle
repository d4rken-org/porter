def signingFile = rootProject.file("signing.properties")
def signingProperties = new Properties()
def developmentSigning = providers.gradleProperty("porter.developmentSigning").orNull == "true"
if (signingFile.canRead()) {
    signingFile.withInputStream { signingProperties.load(it) }
    ["KEYSTORE_FILE", "KEYSTORE_PASSWORD", "KEYSTORE_ALIAS", "KEYSTORE_ALIAS_PASSWORD"].each { key ->
        if (!signingProperties[key]) throw new GradleException("Missing ${key} in signing.properties")
    }
    android.signingConfigs.sign.with {
        storeFile = rootProject.file(signingProperties["KEYSTORE_FILE"])
        storePassword = signingProperties["KEYSTORE_PASSWORD"]
        keyAlias = signingProperties["KEYSTORE_ALIAS"]
        keyPassword = signingProperties["KEYSTORE_ALIAS_PASSWORD"]
    }
} else {
    android.signingConfigs.sign.with {
        storeFile = android.signingConfigs.debug.storeFile
        storePassword = android.signingConfigs.debug.storePassword
        keyAlias = android.signingConfigs.debug.keyAlias
        keyPassword = android.signingConfigs.debug.keyPassword
    }
}

def verifyReleaseSigning = tasks.register("verifyReleaseSigning") {
    doLast {
        if (!signingFile.canRead() && !developmentSigning) {
            throw new GradleException("Release signing requires signing.properties. Local testing only: -Pporter.developmentSigning=true")
        }
    }
}
tasks.configureEach {
    if (name == "preReleaseBuild" || name == "validateSigningRelease") {
        dependsOn(verifyReleaseSigning)
    }
}
