androidComponents.onVariants(androidComponents.selector().all()) { variant ->
    // Refine must leave Robolectric's signed JVM crypto provider byte-for-byte intact.
    variant.unitTest?.instrumentation?.excludes?.addAll(["org/conscrypt/**", "org/bouncycastle/**"])
    if (variant.productFlavors.any { it.second == "foss" }) {
        def embedded = configurations.create("${variant.name}CompatibilityApk") {
            canBeConsumed = false
            canBeResolved = true
        }
        dependencies.add(embedded.name, dependencies.project(path: ":compat", configuration: "embedded${variant.buildType.capitalize()}"))
        def task = tasks.register("embed${variant.name.capitalize()}Compatibility", EmbedCompatibilityApk) {
            apkDirectories.from(embedded)
            outputDirectory.set(layout.buildDirectory.dir("generated/compatibilityAssets/${variant.name}"))
        }
        variant.sources.assets.addGeneratedSourceDirectory(task) { it.outputDirectory }
    }
}

autoResConfig {
    generatedClassFullName = "rikka.shizuku.manager.ShizukuLocales"
    generateRes = false
    generatedArrayFirstItem = "SYSTEM"
    generateLocaleConfig = true
}

android.applicationVariants.configureEach { variant ->
    variant.preBuildProvider.configure {
        dependsOn(":shell:assemble${variant.buildType.name.capitalize()}")
    }
    variant.outputs.configureEach {
        outputFileName = "porter-v${variant.versionName}-${variant.flavorName == 'foss' ? variant.buildType.name : variant.name}.apk"

        variant.assembleProvider.get().doLast {
            def outDir = new File(rootDir, "out")
            def mappingDir = new File(outDir, "mapping").absolutePath
            def apkDir = new File(outDir, "apk").absolutePath

            if (variant.getBuildType().isMinifyEnabled()) {
                copy {
                    from variant.mappingFileProvider.get()
                    into mappingDir
                    rename { String fileName -> "mapping-${variant.versionName}-${variant.name}.txt" }
                }
                copy {
                    from outputFile
                    into apkDir
                }
            }
        }
    }
}

tasks.withType(CompileArtProfileTask.class).configureEach {
