import com.android.build.gradle.internal.tasks.CompileArtProfileTask

abstract class EmbedCompatibilityApk extends DefaultTask {
    @InputFiles @PathSensitive(PathSensitivity.RELATIVE)
    abstract ConfigurableFileCollection getApkDirectories()
    @OutputDirectory
    abstract DirectoryProperty getOutputDirectory()

    @TaskAction
    void embed() {
        def apks = apkDirectories.asFileTree.matching { include "**/*.apk" }.files
        if (apks.size() != 1) throw new GradleException("Expected one signed compatibility APK, found ${apks.size()}")
        def target = outputDirectory.file("compat/porter-compat.apk").get().asFile
        target.parentFile.mkdirs()
        java.nio.file.Files.copy(apks.first().toPath(), target.toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING)
    }
}

