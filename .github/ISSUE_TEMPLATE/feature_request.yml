name: Suggest an improvement
description: Tell us what you would like to do with Porter
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: Describe the task or difficulty you have. You do not need to propose a technical solution.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Include the affected app or device if relevant.
