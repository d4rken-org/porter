name: Bug report
description: Report a problem with Porter
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Porter version
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and Android version
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Startup mode
      options: [Wireless debugging, Computer ADB, Root]
  - type: textarea
    id: reproducer
    attributes:
      label: What happened and how to reproduce it
      description: Include the client app version, whether Porter Compatibility or Shizuku is installed, and relevant logs.
    validations:
      required: true
