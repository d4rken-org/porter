name: Emulator integration tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apks:
    name: Build test APKs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - uses: ./.github/actions/sdk-branch
      - uses: ./.github/actions/android-setup
      - name: Build test APKs
        run: ./gradlew :manager:assembleFossDebug :compat:assembleDebug :probe:assemblePorterDebug :probe:assembleLegacyDebug :probe:assembleBridgeRelease :unlisted-manager-fixture:assembleDebug
      # Several roots, so the artifact is rooted at the workspace and every job downloads each APK to
      # the path it was built at.
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f #v6.0.0
        with:
          name: porter-emulator-apks
          path: |
            manager/build/outputs/apk/foss/debug/*.apk
            compat/build/outputs/apk/debug/*.apk
            probe/build/outputs/apk/porter/debug/*.apk
            probe/build/outputs/apk/legacy/debug/*.apk
            probe/build/outputs/apk/bridge/release/*.apk
            probe/build/outputs/mapping/bridgeRelease/mapping.txt
            test-fixtures/unlisted-manager/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  smoke:
    name: ${{ matrix.suite }} (Android ${{ matrix.api }})
    needs: apks
    # A skipped job satisfies a required check, so these run when the build failed too and fail
    # themselves. Only a cancelled run skips them.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SHIZUKU_SHA256: 6e273ab0e991c4e79bc8b1bbb9b9dd739ccac1a8712a541a214078886b7b790f
    strategy:
      fail-fast: false
      matrix:
        api: [30, 36]
        suite: [emulator, compat-install, dualwire]
        include:
          # Keyed on the suite alone, so this augments the two dualwire combinations rather than
          # creating new ones. A top-level extra: list would multiply every combination and hand
          # these arguments to the other suites, whose parsers reject what they do not know.
          - suite: dualwire
            extra: --bridge probe/build/outputs/apk/bridge/release/*.apk --unlisted test-fixtures/unlisted-manager/build/outputs/apk/debug/*.apk
          - api: 34
            suite: compat-install
            target: android-tv
            arch: x86
            profile: tv_1080p
            input: --dpad
    steps:
      - name: Require the test APKs
        if: needs.apks.result != 'success'
        run: |
          echo "::error::Building the test APKs failed, so there is nothing to test."
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/device-setup
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c #v8.0.1
        with:
          name: porter-emulator-apks
      - name: Restore pinned Shizuku cache
        id: shizuku-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 #v6.1.0
        with:
          path: ${{ runner.temp }}/shizuku.apk
          key: shizuku-apk-${{ env.SHIZUKU_SHA256 }}
      - name: Download pinned Shizuku for coexistence testing
        if: steps.shizuku-cache.outputs.cache-hit != 'true'
        run: |
          curl --fail --location --retry 5 --retry-delay 10 --retry-max-time 180 \
            --connect-timeout 15 --max-time 120 -o "$RUNNER_TEMP/shizuku.apk" \
            https://github.com/RikkaApps/Shizuku/releases/download/v13.6.0/shizuku-v13.6.0.r1086.2650830c-release.apk
      - name: Verify pinned Shizuku checksum
        run: echo "$SHIZUKU_SHA256  $RUNNER_TEMP/shizuku.apk" | sha256sum --check
      - name: Save verified Shizuku cache
        if: steps.shizuku-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 #v6.1.0
        with:
          path: ${{ runner.temp }}/shizuku.apk
          key: shizuku-apk-${{ env.SHIZUKU_SHA256 }}
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install emulator packages
        env:
          EMULATOR_API: ${{ matrix.api }}
          EMULATOR_TARGET: ${{ matrix.target || 'google_apis' }}
          EMULATOR_ARCH: ${{ matrix.arch || 'x86_64' }}
        run: python3 tools/ci/install-sdk.py platform-tools "build-tools;37.0.0" "platforms;android-$EMULATOR_API" emulator "system-images;android-$EMULATOR_API;$EMULATOR_TARGET;$EMULATOR_ARCH"
      - name: Run real Binder and permission scenarios
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d #v2.38.0
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.target || 'google_apis' }}
          arch: ${{ matrix.arch || 'x86_64' }}
          profile: ${{ matrix.profile || 'pixel_2' }}
          avd-name: porter-ci
          emulator-port: 5554
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-audio -no-boot-anim -camera-back none
          disable-animations: true
          script: >-
            python3 tools/ci/${{ matrix.suite }}-smoke.py --serial emulator-5554 ${{ matrix.input }}
            --manager manager/build/outputs/apk/foss/debug/*.apk
            --compat compat/build/outputs/apk/debug/*.apk
            --native probe/build/outputs/apk/porter/debug/*.apk
            --legacy probe/build/outputs/apk/legacy/debug/*.apk
            --shizuku "$RUNNER_TEMP/shizuku.apk"
            --output build/emulator-results ${{ matrix.extra }}
      - name: Upload device test evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f #v6.0.0
        with:
          name: porter-${{ matrix.suite }}-api-${{ matrix.api }}
          path: |
            build/emulator-results/
            probe/build/outputs/mapping/bridgeRelease/mapping.txt
          if-no-files-found: warn

  boot:
    name: boot (Android ${{ matrix.api }})
    needs: apks
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    # Three reboots, each of which has to come all the way back up before the case can judge it.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # 36 only, and that is the image rather than Porter. On the API 30 google_apis x86_64
        # image adbd serves the host over the emulator pipe and never opens a listening socket
        # for the port `adb tcpip` reports: service.adb.tcp.port reads 5555 and adbd logs "adbd
        # listening on tcp:5555", but nothing is bound to 5555 and a device-local connect is
        # refused. The manager takes that port from the property and goes straight at it, so its
        # five attempts each fail to connect and it never sends an ADB byte. The "already
        # offline" lines an earlier reading rested on are the host's own transport reattaching
        # after adbd restarts, and appear with no app installed. That pipe is an emulator
        # transport, so none of this describes a physical Android 11 device; one was not tested.
        api: [36]
    steps:
      - name: Require the test APKs
        if: needs.apks.result != 'success'
        run: |
          echo "::error::Building the test APKs failed, so there is nothing to test."
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/device-setup
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c #v8.0.1
        with:
          name: porter-emulator-apks
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install emulator packages
        env:
          EMULATOR_API: ${{ matrix.api }}
        run: python3 tools/ci/install-sdk.py platform-tools "build-tools;37.0.0" "platforms;android-$EMULATOR_API" emulator "system-images;android-$EMULATOR_API;google_apis;x86_64"
      - name: Start Porter from the app and reboot
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d #v2.38.0
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_2
          avd-name: porter-ci
          emulator-port: 5554
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-audio -no-boot-anim -camera-back none
          disable-animations: true
          script: >-
            python3 tools/ci/boot-smoke.py --serial emulator-5554
            --manager manager/build/outputs/apk/foss/debug/*.apk
            --native probe/build/outputs/apk/porter/debug/*.apk
            --output build/emulator-results
      - name: Upload device test evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f #v6.0.0
        with:
          name: porter-boot-api-${{ matrix.api }}
          path: build/emulator-results/
          if-no-files-found: warn
