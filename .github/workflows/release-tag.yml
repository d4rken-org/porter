name: Tagged releases

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build signed review APKs without publishing a release
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  # Deliberately carries no environment. release-github runs under
  # foss-production, which requires a manual review, so validating in there
  # would spend an approval before the tag is known to be releasable.
  validate-tag:
    name: Validate tag
    if: github.event_name == 'push'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
        with:
          persist-credentials: false
      # The tag reaches the shell through the environment, never through
      # expression interpolation: a tag name is attacker-controllable text and
      # ${{ }} is substituted before bash parses the line, so quoting it there
      # would not contain it.
      - name: Validate tag against version files
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: bash tools/release/bump.sh --mode=check --expected-tag="$RELEASE_TAG"

  release-github:
    name: Build signed release
    needs: [validate-tag, gplay-companion]
    # !cancelled() rather than always(): it still overrides the implicit
    # success() that a skipped dependency would otherwise trip on a manual
    # dispatch, without keeping a signing and publishing job eligible after
    # the workflow has been cancelled.
    if: ${{ !cancelled() && (needs.validate-tag.result == 'success' || github.event_name == 'workflow_dispatch') && (needs.gplay-companion.result == 'success' || (github.event_name == 'workflow_dispatch' && inputs.dry_run)) }}
    runs-on: ubuntu-26.04
    environment: foss-production
    permissions:
      contents: write
      actions: write
    env:
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
      RELEASE_TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Guard release ref
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$DRY_RUN" != true && "$GITHUB_REF" != refs/tags/v* ]]; then
            echo '::error::Publishing requires a version tag. Use dry_run for branch builds.'
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false
      - name: Validate version
        shell: bash
        run: |
          args=(--mode=check)
          if [[ "$DRY_RUN" != true ]]; then args+=("--expected-tag=$RELEASE_TAG"); fi
          bash tools/release/bump.sh "${args[@]}"
      - name: Reconcile existing release
        id: existing
        if: env.DRY_RUN != 'true'
        shell: bash
        run: |
          set -euo pipefail
          releases=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --slurp)
          release=$(jq -c --arg tag "$RELEASE_TAG" '[.[][] | select(.tag_name == $tag)][0] // empty' <<< "$releases")
          published=false
          if [[ -n "$release" ]]; then
            if jq -e '.draft' <<< "$release" >/dev/null; then
              gh release delete "$RELEASE_TAG" --yes
            elif jq -e --arg tag "$RELEASE_TAG" '
              [.assets[].name] as $names |
              ["porter-"+$tag+"-release.apk", "porter-compat-"+$tag+"-release.apk", "porter-compat-"+$tag+"-gplay.apk", "SHA256SUMS", "verification.txt", "build-info.json"] |
              all(. as $name | $names | index($name) != null)' <<< "$release" >/dev/null; then
              published=true
            else
              echo '::error::Published release is incomplete. Refusing to overwrite it.'
              exit 1
            fi
          fi
          echo "published=$published" >> "$GITHUB_OUTPUT"
      - name: Set up Android build
        if: steps.existing.outputs.published != 'true'
        uses: ./.github/actions/android-setup
      - name: Unit tests
        if: steps.existing.outputs.published != 'true'
        run: ./gradlew :manager:testFossDebugUnitTest :manager:testGplayDebugUnitTest :server:testDebugUnitTest
      - name: Upload unit test reports
        if: always() && steps.existing.outputs.published != 'true'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f #v6.0.0
        with:
          name: porter-release-unit-tests
          path: |
            **/build/test-results/**/*.xml
            **/build/reports/tests/**
          if-no-files-found: warn
      - name: Decode keystore
        if: steps.existing.outputs.published != 'true'
        env:
          ENCODED_KEYSTORE: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/porter-signing"
          printf '%s' "$ENCODED_KEYSTORE" | base64 --decode > "$RUNNER_TEMP/porter-signing/keystore.jks"
          test -s "$RUNNER_TEMP/porter-signing/keystore.jks"
          echo "STORE_PATH=$RUNNER_TEMP/porter-signing/keystore.jks" >> "$GITHUB_ENV"
      - name: Assemble signed APKs
        if: steps.existing.outputs.published != 'true'
        run: ./gradlew :manager:assembleFossRelease :compat:assembleRelease
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      - name: Fetch the companion for Google Play
        if: env.DRY_RUN != 'true' && steps.existing.outputs.published != 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c #v8.0.1
        with:
          name: porter-gplay-companion-${{ github.sha }}
          path: ${{ runner.temp }}/gplay-companion
      - name: Verify and package downloads
        if: steps.existing.outputs.published != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp manager/build/outputs/apk/foss/release/*.apk compat/build/outputs/apk/release/*.apk dist/
          python3 tools/verify-apks.py manager/build/outputs/apk/foss/release/*.apk compat/build/outputs/apk/release/*.apk --embedded required | tee dist/verification.txt
          if [[ "$DRY_RUN" != true ]]; then
            cp "$RUNNER_TEMP"/gplay-companion/*.apk dist/
            cat "$RUNNER_TEMP/gplay-companion/verification.txt" >> dist/verification.txt
          fi
          (cd dist && sha256sum -- *.apk > SHA256SUMS)
          jq -n --arg commit "$(git rev-parse HEAD)" --arg api "$(git -C api rev-parse HEAD)" \
            --arg run "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            '{commit: $commit, api_commit: $api, workflow_run: $run}' > dist/build-info.json
      - name: Upload signed review artifacts
        if: steps.existing.outputs.published != 'true'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f #v6.0.0
        with:
          name: porter-signed-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
      - name: Create draft with all downloads
        if: env.DRY_RUN != 'true' && steps.existing.outputs.published != 'true'
        shell: bash
        run: |
          args=(--draft --verify-tag --title "Porter $RELEASE_TAG" --generate-notes)
          if [[ "$RELEASE_TAG" == *-beta* ]]; then args+=(--prerelease); fi
          gh release create "$RELEASE_TAG" "${args[@]}" dist/*
      - name: Publish complete release
        if: env.DRY_RUN != 'true' && steps.existing.outputs.published != 'true'
        shell: bash
        run: |
          args=(--draft=false)
          if [[ "$RELEASE_TAG" == *-beta* ]]; then args+=(--prerelease); else args+=(--latest); fi
          gh release edit "$RELEASE_TAG" "${args[@]}"
      - name: Deploy user guide
        if: env.DRY_RUN != 'true'
        run: gh workflow run pages.yml --ref main
      - name: Remove signing material
        if: always()
        run: rm -rf "$RUNNER_TEMP/porter-signing"

  # The Play app signing key lives only in this environment. Dry runs and non-tag refs skip it.
  gplay-companion:
    name: Sign the companion for Google Play
    needs: validate-tag
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/v') && (needs.validate-tag.result == 'success' || (github.event_name == 'workflow_dispatch' && !inputs.dry_run)) }}
    runs-on: ubuntu-26.04
    environment: gplay-production
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false
      - name: Validate version
        run: bash tools/release/bump.sh --mode=check --expected-tag="$RELEASE_TAG"
      - name: Set up Android build
        uses: ./.github/actions/android-setup
      # Development signing falls back to the debug keystore, which only a debug build creates.
      # The Play key never reaches Gradle; the companion is re-signed afterwards.
      - name: Build the companion
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon :compat:assembleDebug
          ./gradlew --no-daemon :compat:assembleRelease -Pporter.developmentSigning=true
      - name: Decode Google Play app signing keystore
        env:
          ENCODED_KEYSTORE: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/porter-signing"
          printf '%s' "$ENCODED_KEYSTORE" | base64 --decode > "$RUNNER_TEMP/porter-signing/gplay-signing.jks"
          if [[ ! -s "$RUNNER_TEMP/porter-signing/gplay-signing.jks" ]]; then
            echo '::error::SIGNING_KEYSTORE_BASE64 is missing from this environment.'
            exit 1
          fi
      - name: Sign the companion
        env:
          GPLAY_STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          GPLAY_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          GPLAY_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          export GPLAY_STORE_PATH="$RUNNER_TEMP/porter-signing/gplay-signing.jks"
          mkdir -p "$RUNNER_TEMP/gplay-companion"
          companion=(compat/build/outputs/apk/release/*.apk)
          name=$(basename "${companion[0]}")
          python3 tools/release/sign-gplay-companion.py "${companion[0]}" "$RUNNER_TEMP/gplay-companion/${name%-release.apk}-gplay.apk" | tee "$RUNNER_TEMP/gplay-companion/verification.txt"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f #v6.0.0
        with:
          name: porter-gplay-companion-${{ github.sha }}
          path: ${{ runner.temp }}/gplay-companion/
          if-no-files-found: error
          overwrite: true
          retention-days: 14
      - name: Remove signing material
        if: always()
        run: rm -rf "$RUNNER_TEMP/porter-signing"

  # Runs beside release-github rather than after it: a failed Play upload must not hold back the
  # GitHub release, and the reverse. A dry run skips this job entirely, because its environment
  # requires a review and the job's only output is the upload.
  release-gplay:
    name: Upload to Google Play
    needs: validate-tag
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/v') && (needs.validate-tag.result == 'success' || (github.event_name == 'workflow_dispatch' && !inputs.dry_run)) }}
    runs-on: ubuntu-26.04
    environment: gplay-production-upload
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      BUNDLE_GEMFILE: ${{ github.workspace }}/fastlane/Gemfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false
      - name: Validate version
        shell: bash
        run: |
          set -euo pipefail
          bash tools/release/bump.sh --mode=check --expected-tag="$RELEASE_TAG" | tee "$RUNNER_TEMP/version.txt"
          sed -n 's/^current_code=/PORTER_VERSION_CODE=/p' "$RUNNER_TEMP/version.txt" >> "$GITHUB_ENV"
      - name: Set up Android build
        uses: ./.github/actions/android-setup
      - name: Decode upload keystore
        env:
          ENCODED_KEYSTORE: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/porter-signing"
          printf '%s' "$ENCODED_KEYSTORE" | base64 --decode > "$RUNNER_TEMP/porter-signing/upload.jks"
          if [[ ! -s "$RUNNER_TEMP/porter-signing/upload.jks" ]]; then
            echo '::error::SIGNING_KEYSTORE_BASE64 is missing from this environment.'
            exit 1
          fi
          echo "STORE_PATH=$RUNNER_TEMP/porter-signing/upload.jks" >> "$GITHUB_ENV"
      # Built before the service account key exists on the runner, and without a daemon that would
      # outlive the build.
      - name: Build the bundle
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon :manager:bundleGplayRelease
          rm -f "$STORE_PATH"
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b #v1.321.0
        with:
          ruby-version: 3.3.12
          bundler-cache: true
          working-directory: fastlane
      - name: Verify fastlane Bundler wiring
        run: bundle exec fastlane --version
      - name: Decode Google Play service account key
        env:
          ENCODED_SERVICE_KEY: ${{ secrets.GPLAY_SERVICE_ACCOUNT_KEY_JSON_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$ENCODED_SERVICE_KEY" | base64 --decode > "$RUNNER_TEMP/porter-signing/service_account.json"
          # An unset secret decodes to an empty file, which supply would only reject with a less
          # specific error.
          if ! jq -e . "$RUNNER_TEMP/porter-signing/service_account.json" >/dev/null 2>&1; then
            echo '::error::GPLAY_SERVICE_ACCOUNT_KEY_JSON_BASE64 is missing or not base64-encoded JSON in this environment.'
            exit 1
          fi
          echo "SUPPLY_JSON_KEY=$RUNNER_TEMP/porter-signing/service_account.json" >> "$GITHUB_ENV"
      # Set the environment variable SUPPLY_RELEASE_STATUS to draft for the first upload, while
      # eu.darken.porter is still a draft app, and delete it afterwards.
      - name: Select release status
        env:
          RELEASE_STATUS: ${{ vars.SUPPLY_RELEASE_STATUS }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$RELEASE_STATUS" ]]; then echo "SUPPLY_RELEASE_STATUS=$RELEASE_STATUS" >> "$GITHUB_ENV"; fi
      - name: Upload the bundle
        run: bundle exec fastlane release
        env:
          FASTLANE_SKIP_UPDATE_CHECK: 'true'
          PORTER_AAB: ${{ github.workspace }}/manager/build/outputs/bundle/gplayRelease/manager-gplay-release.aab
      - name: Remove signing material
        if: always()
        run: rm -rf "$RUNNER_TEMP/porter-signing"
