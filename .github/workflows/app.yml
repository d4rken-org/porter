name: Porter development build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v5
      - name: Install Android tools
        run: sdkmanager "platforms;android-37" "build-tools;37.0.0" "ndk;29.0.13113456" "cmake;3.31.6"
      - name: Build development APKs and adapter
        run: ./gradlew :manager:assembleDebug :compat:assembleDebug :probe:assembleDebug :client:assembleRelease :server:testDebugUnitTest
      - name: Verify APK identities
        run: python3 tools/verify-apks.py manager/build/outputs/apk/debug/*.apk compat/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v6
        with:
          name: porter-development
          path: |
            manager/build/outputs/apk/debug/*.apk
            compat/build/outputs/apk/debug/*.apk
            client/build/outputs/aar/*.aar
            probe/build/outputs/apk/**/*.apk
          if-no-files-found: error
