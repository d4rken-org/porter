name: Porter development build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Development build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
        with:
          submodules: recursive
      - uses: ./.github/actions/android-setup
      - name: Check release version and scripts
        run: |
          bash tools/release/bump.sh --mode=check
          sudo apt-get update && sudo apt-get install -y bats
          bats tools/release/bump.bats
      - name: Build development APKs and adapter
        run: ./gradlew :manager:assembleDebug :compat:assembleDebug :probe:assembleDebug :client:assembleRelease :server:testDebugUnitTest :manager:testDebugUnitTest
      - name: Verify APK identities
        run: python3 tools/verify-apks.py manager/build/outputs/apk/debug/*.apk compat/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f #v6.0.0
        with:
          name: porter-development
          path: |
            manager/build/outputs/apk/debug/*.apk
            compat/build/outputs/apk/debug/*.apk
            api/client/build/outputs/aar/*.aar
            probe/build/outputs/apk/**/*.apk
          if-no-files-found: error
