name: Porter development build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  submodule:
    name: Submodule pin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
        with:
          persist-credentials: false
      - name: Pin must be reachable from porter-api main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          pin="$(git ls-tree HEAD api | awk '{print $3}')"
          if [ -z "$pin" ]; then
            echo "::error::No gitlink at api/, but settings.gradle.kts builds the Porter SDK from there."
            exit 1
          fi
          echo "Pinned porter-api commit: $pin"
          err="$(mktemp)"
          if ! status="$(gh api "repos/d4rken-org/porter-api/compare/main...$pin" --jq .status 2>"$err")"; then
            if grep -qi 'HTTP 404' "$err"; then
              echo "::error::porter-api has no commit $pin. Push it to porter-api before pushing the gitlink that points at it."
            else
              echo "::error::Could not query porter-api, so $pin is unverified. This is not a verdict on the pin:"
              cat "$err"
            fi
            exit 1
          fi
          case "$status" in
            identical | behind)
              echo "Reachable from porter-api main ($status)."
              ;;
            *)
              echo "::error::$pin is not reachable from porter-api main (compare status: $status). Merge it into porter-api main first."
              exit 1
              ;;
          esac

  build:
    name: Development build
    needs: submodule
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - uses: ./.github/actions/sdk-branch
      - name: Test CI helpers
        run: python3 -m unittest discover -s tools/ci -p 'test_*.py'
      - uses: ./.github/actions/android-setup
      - name: Check release version and scripts
        run: |
          bash tools/release/bump.sh --mode=check
          sudo apt-get update && sudo apt-get install -y bats shellcheck
          shellcheck tools/release/bump.sh
          bats tools/release/bump.bats
      - name: Unit tests
        run: ./gradlew :manager:testFossDebugUnitTest :manager:testGplayDebugUnitTest :server:testDebugUnitTest
      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f #v6.0.0
        with:
          name: porter-unit-tests
          path: |
            **/build/test-results/**/*.xml
            **/build/reports/tests/**
          if-no-files-found: warn
      - name: Build development APKs
        run: ./gradlew :manager:assembleDebug :compat:assembleDebug :probe:assembleDebug
      - name: Verify APK identities
        run: |
          python3 tools/verify-apks.py manager/build/outputs/apk/foss/debug/*.apk compat/build/outputs/apk/debug/*.apk --embedded required
          python3 tools/verify-apks.py manager/build/outputs/apk/gplay/debug/*.apk compat/build/outputs/apk/debug/*.apk --embedded absent
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f #v6.0.0
        with:
          name: porter-development
          path: |
            manager/build/outputs/apk/*/debug/*.apk
            compat/build/outputs/apk/debug/*.apk
            probe/build/outputs/apk/**/*.apk
          if-no-files-found: error

  lint:
    name: Android lint
    needs: submodule
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - uses: ./.github/actions/sdk-branch
      - uses: ./.github/actions/android-setup
      - run: ./gradlew :manager:lintVitalFossRelease :manager:lintVitalGplayRelease :compat:lintVitalRelease -Pporter.developmentSigning=true
      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f #v6.0.0
        with:
          name: porter-lint
          path: |
            **/build/reports/lint-*
            **/build/intermediates/lint_vital_intermediate_text_report/**

  wrapper:
    name: Gradle wrapper validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
        with:
          persist-credentials: false
      - uses: gradle/actions/wrapper-validation@3f131e8634966bd73d06cc69884922b02e6faf92 #v6.2.0
