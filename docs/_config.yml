title: Porter
description: A minimal, maintained Shizuku fork that gives Android apps ADB access through the Shizuku APIs, with optional root support.
url: https://porter.darken.eu
baseurl: ""
repository_url: https://github.com/d4rken-org/porter
markdown: kramdown
kramdown:
  input: GFM
plugins:
  - jekyll-relative-links
relative_links:
  enabled: true
  collections: false
collections:
  translations:
    output: false
defaults:
  - scope:
      path: ""
    values:
      layout: default
exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
